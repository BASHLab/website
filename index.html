    <script>
        let allNews = [];

        function getColumnCount() {
            const width = window.innerWidth;
            if (width <= 500) return 1;
            if (width <= 800) return 2;
            if (width <= 1200) return 3;
            if (width <= 1600) return 4;
            return 5;
        }

        function layoutMasonry() {
            const newsGrid = document.getElementById('news-grid');
            const cards = newsGrid.querySelectorAll('.news-card-container');
            const columnCount = getColumnCount();
            const gap = 15;

            if (cards.length === 0) return;

            // Calculate column width
            const containerWidth = newsGrid.offsetWidth;
            const columnWidth = (containerWidth - (gap * (columnCount - 1))) / columnCount;

            // Initialize column heights
            const columnHeights = new Array(columnCount).fill(0);

            cards.forEach((card, index) => {
                // Find the shortest column
                const shortestColumnIndex = columnHeights.indexOf(Math.min(...columnHeights));

                // Position the card
                const left = shortestColumnIndex * (columnWidth + gap);
                const top = columnHeights[shortestColumnIndex];

                card.style.left = left + 'px';
                card.style.top = top + 'px';
                card.style.width = columnWidth + 'px';

                // Update column height
                columnHeights[shortestColumnIndex] += card.offsetHeight + gap;
            });

            // Set container height
            const maxHeight = Math.max(...columnHeights) - gap;
            newsGrid.style.height = maxHeight + 'px';
        }

        function displayNews() {
            const newsGrid = document.getElementById('news-grid');
            newsGrid.innerHTML = '';

            allNews.forEach((newsItem, index) => {
                const newsCard = createNewsCard(newsItem, index);
                newsGrid.appendChild(newsCard);
            });

            // Wait for images to load before laying out
            setTimeout(() => {
                layoutMasonry();
            }, 100);
        }

        // Re-layout on window resize
        window.addEventListener('resize', () => {
            setTimeout(layoutMasonry, 100);
        });

        function processRedText(text) {
            // Replace text wrapped in [red]...[/red] with red spans
            return text.replace(/\[red\](.*?)\[\/red\]/g, '<span class="red-text">$1</span>');
        }

        function createNewsCard(newsItem, index) {
            const cardContainer = document.createElement('div');

            // Create more dynamic height variation based on content length and index
            const contentLength = newsItem.content.length;
            let heightClass;

            if (contentLength < 100) {
                heightClass = 'height-small';
            } else if (contentLength < 200) {
                heightClass = 'height-medium';
            } else if (contentLength < 300) {
                heightClass = 'height-large';
            } else {
                heightClass = 'height-extra-large';
            }

            // Add some randomness based on index to avoid too much uniformity
            const variation = ['height-small', 'height-medium', 'height-large'];
            if (index % 4 === 0) {
                heightClass = variation[index % 3];
            }

            cardContainer.className = `news-card-container ${heightClass}`;

            // Process titles for red text
            const processedTitle = processRedText(newsItem.title);
            const processedContent = processRedText(newsItem.content);

            // Create a short title from the full title (first few words) - strip HTML for length calculation
            const plainTitle = newsItem.title.replace(/\[red\]|\[\/red\]/g, '');
            const shortTitle = plainTitle.split(' ').slice(0, 6).join(' ') + (plainTitle.split(' ').length > 6 ? '...' : '');
            const processedShortTitle = processRedText(shortTitle);

            const isValidUrl = newsItem.url && (newsItem.url.startsWith('http') || newsItem.url.startsWith('www') || newsItem.url.endsWith('.html'));
            const cardContent = `
                <div class="simple-card">
                    <div class="card-image">
                        <img src="${newsItem.image}" alt="News Image" onerror="this.src='./img/research_clusters/sensor.png'">
                    </div>
                    <div class="card-body">
                        <h3 class="card-title">${processedTitle}</h3>
                        <p class="card-description">${processedContent}</p>
                        <div class="card-date">${newsItem.date}</div>
                    </div>
                </div>
            `;

            cardContainer.innerHTML = cardContent;

            // Add click handler if there's a valid URL
            if (isValidUrl && newsItem.url !== '#') {
                cardContainer.style.cursor = 'pointer';
                cardContainer.addEventListener('click', () => {
                    if (newsItem.url.startsWith('http') || newsItem.url.startsWith('www')) {
                        window.open(newsItem.url, '_blank');
                    } else {
                        window.location.href = newsItem.url;
                    }
                });
            }

            return cardContainer;
        }
    </script>
