    <div style="margin-top: 80px;"></div>

    <section id="members" class="home-section">
        <div class="container">
            <div class="row" id="members-container">
                <!-- Members will be loaded dynamically from JSON -->

            <div class="row" id="alumni-container" style="margin-top: 30px;">
                <!-- Alumni will be loaded dynamically from JSON -->

            <div class="row" id="collaborators-container" style="margin-top: 30px;">
                <div class="col-xs-12 col-md-12">
                    <div class="collaborators-section">
                        <h2 class="section-heading">Collaborators</h2>
                        <div class="collaborator-logos">
                            <div class="row" id="collaborator-logos-container">

    <style>
        /* Navbar Logo */
        .navbar-logo {
            height: 60px;
            width: auto;
            margin-top: -15px;
            margin-bottom: -15px;
        }

        .navbar-brand {
            padding: 15px 15px;
        }

        .navbar-brand:hover {
            text-decoration: none;
        }

        .collaborators-section {
            padding: 20px;
            background-color: #f9f9f9;
            border-radius: 8px;
            margin-top: 20px;
        }
        .collaborator-logos {
            margin-top: 20px;
        }
        .collaborator-logo {
            max-width: 100%;
            max-height: 80px;
            margin: 10px;
            filter: grayscale(50%);
            transition: filter 0.3s ease;
        }
        .collaborator-logo:hover {
            filter: grayscale(0%);
        }
        .section-heading h2 {
            color: #AC2B37;
            border-bottom: 2px solid #AC2B37;
            padding-bottom: 10px;
            margin-bottom: 30px;
        }
        #profile {
            margin-bottom: 30px;
        }
        .portrait {
            width: 200px;
            height: 200px;
            margin: 0 auto 15px auto;
            border-radius: 50%;
            background-size: cover;
            background-position: center;
            border: 3px solid #AC2B37;
        }
        .portrait-title h4 {
            color: #AC2B37;
            margin-bottom: 5px;
        }
        .portrait-title h5 {
            color: #666;
            font-size: 0.9em;
        }
    </style>

    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.5/js/bootstrap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/wow/1.1.2/wow.min.js"></script>
    <script>new WOW().init();</script>

    <script>
        (async function(){
            try {
                const response = await fetch('./team.json?v=' + Date.now(), {
                    headers: {
                        'Accept': 'application/json'
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                
                // Render members
                const membersContainer = document.getElementById('members-container');
                if (membersContainer && data.members) {
                    data.members.forEach(member => {
                        const memberDiv = document.createElement('div');
                        memberDiv.className = 'col-xs-12 col-md-3';
                        
                        const profile = document.createElement('div');
                        profile.id = 'profile';
                        profile.className = 'wow fadeInUp';
                        profile.setAttribute('data-wow-delay', '0.1s');

                        const content = `
                            <a href="${member.url}">
                                <div class="portrait" itemprop="image"
                                    style="background-image: url('img//portraits/${member.image}');">
                                </div>
                            </a>
                            <div class="portrait-title">
                                <h4 itemprop="name"><a href="${member.url}">${member.name}</a></h4>
                                <h5>${member.title}</h5>
                            </div>
                        `;
                        
                        profile.innerHTML = content;
                        memberDiv.appendChild(profile);
                        membersContainer.appendChild(memberDiv);
                    });
                }

                // Render alumni
                const alumniContainer = document.getElementById('alumni-container');
                if (alumniContainer && (data.undergraduateAlumni?.length > 0 || data.mastersAlumni?.length > 0)) {
                    // Function to create alumni section
                    const createAlumniSection = (title, alumni) => {
                        if (!alumni || alumni.length === 0) return '';
                        
                        const alumniList = alumni.map(alum => 
                            `${alum.name}, ${alum.degree}, ${alum.graduationYear} → ${alum.currentPosition}`
                        ).join('<br>');
                        
                        return `
                            <div class="col-xs-12 col-md-12">
                                <h2 class="section-heading">${title}</h2>
                            </div>
                            <div class="col-xs-12" style="font-size: 1.1em; line-height: 1.8; color: #444; margin-bottom: 30px;">
                                ${alumniList}
                            </div>
                        `;
                    };

                    // Create both sections
                    const undergraduateSection = createAlumniSection('Undergraduate & Masters Alumni', data.undergraduateAlumni);
                    const mastersSection = createAlumniSection('Masters Alumni', data.mastersAlumni);
                    
                    alumniContainer.innerHTML = undergraduateSection + mastersSection;
                }

                // Render collaborators
                const collaboratorsContainer = document.getElementById('collaborator-logos-container');
                if (collaboratorsContainer && data.collaborators) {
                    data.collaborators.forEach(collab => {
                        const collabDiv = document.createElement('div');
                        collabDiv.className = 'col-xs-6 col-md-2';
                        
                        collabDiv.innerHTML = `
                            <img src="img/${collab.logo}" alt="${collab.name}" class="collaborator-logo">
                        `;
                        
                        collaboratorsContainer.appendChild(collabDiv);
                    });
                }

            } catch (err) {
                console.error('Failed to load team.json:', err);
                const containers = ['members-container', 'alumni-container', 'collaborator-logos-container'];
                containers.forEach(containerId => {
                    const container = document.getElementById(containerId);
                    if (container) {
                        container.innerHTML = `<div class="alert alert-danger">
                            <p><strong>Error loading team data:</strong></p>
                            <p>${err.message}</p>
                        </div>`;
                    }
                });
            }
        })();
    </script>
</body>
</html>
